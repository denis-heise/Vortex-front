			<address class="contacts-item">
				<h3 class="contacts-item__title">@@title</h3>
				<p class="contacts-item__text">@@description</p>

				<div class="contacts-item__meta">
					<div class="contacts-item__metro">
						<svg width="12" height="12" aria-hidden="true" focusable="false">
							<use href="@img/sprite.svg#metro"></use>
						</svg>
						<span>Алексеевская</span>
					</div>
					<button class="button button--transparent-green contacts-item__map-btn" type="button" data-button="show-on-map" data-index="@@index">
						<svg width="12" height="12" aria-hidden="true" focusable="false">
							<use href="@img/sprite.svg#location"></use>
						</svg>
						<span>Посмотреть на карте</span>
					</button>
				</div>

				<div class="contacts-item__footer">
					<a class="contacts-item__phone" href="tel:@@phone">
						<svg width="12" height="12" aria-hidden="true" focusable="false">
							<use href="@img/sprite.svg#phone"></use>
						</svg>
						<span>@@phone_title</span>
					</a>
					<time class="contacts-item__schedule">Звоните 9:00 до 18:00, пн. – пт. Без перерыва.</time>
				</div>
			</address>
