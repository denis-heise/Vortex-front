			<a href="@@link">
				<article class="news-card">
					<div class="news-card__media">
						<div class="badge">
							<span>@@badge</span>
						</div>
						<img class="news-card__img" src="@img/news/@@img.png" alt="@@title">
					</div>

					<div class="news-card__content">
						<time class="news-card__date" datetime="@@date">@@date</time>
						<h3 class="news-card__title" data-element="news-title">@@title</h3>
						<p class="news-card__description" data-element="news-description">@@description</p>
					</div>
				</article>
			</a>
