				<article class="education-card">
					<header class="education-card__header">
						<h2 class="education-card__title">Курсы VALTEX Trading</h2>
					</header>

					<div class="education-card__row">
						<div class="education-card__features">
							<span class="education-card__feature"><span>Продолжительность:</span> 1 день</span>
							<span class="education-card__feature"><span>Группа:</span> до 12 человек</span>
						</div>
						<div class="education-card__logo-wrapper">
							<img class="education-card__logo" src="@img/education-logo-@@img.png" alt="Логотип курса SCA">
						</div>
					</div>

					<a class="education-card__btn-info button button--transparent-green u-color-green" href="#" target="_blank">
						<svg width="16" height="16" aria-hidden="true">
							<use href="@img/sprite.svg#blank_2"></use>
						</svg>
						<span>Описание программы</span>
					</a>

					<div class="split-line"></div>

					<div class="education-card__price-block">
						<span class="education-card__price h1 u-color-green">30 000 ₽</span>
						<span class="education-card__price-info">В стоимость не входит сертификация SCA</span>
					</div>

					<div class="split-line"></div>

					<div class="education-card__meta">
						<div class="education-card__meta-item">
							<span class="education-card__meta-label">Дата:</span>
							<span class="education-card__meta-value u-color-green">20 февраля</span>
						</div>
						<div class="education-card__meta-item">
							<span class="education-card__meta-label">Место проведения:</span>
							<a class="education-card__meta-value u-link" href="#" target="_blank">Тренинг-центр</a>
						</div>
					</div>

					<div class="split-line"></div>

					<div class="education-card__author">
						<span class="education-card__author-label">Курс проводит:</span>
						<div class="education-card__author-profile">
							<div class="education-card__avatar-wrapper">
								<img class="education-card__avatar" src="@img/photo.jpg" alt="Иван Иванов">
							</div>
							<div class="education-card__author-info">
								<span class="education-card__author-name">Иван Иванов</span>
								<span class="education-card__author-rank">Q Grader, AST</span>
							</div>
						</div>
					</div>

					<button class="education-card__btn-action button" type="button" data-button-open="education">
						<span>Записаться</span>
					</button>
				</article>
